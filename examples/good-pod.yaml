apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  labels:
    app: demo
    owner: platform-team
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged:1.25.3
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      # readOnlyRootFilesystem leaves nginx unable to create its temp paths
      # ("mkdir() /tmp/proxy_temp failed (30: Read-only file system)"), so it
      # needs writable scratch space mounted in.
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
  volumes:
    - name: tmp
      emptyDir: {}
    - name: nginx-cache
      emptyDir: {}
