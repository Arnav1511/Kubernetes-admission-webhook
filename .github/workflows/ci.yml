name: CI

"on":
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  # The Trivy gates fail on CVEs published against code that has not changed,
  # and Dependabot does not raise PRs for indirect Go modules. Without a
  # scheduled run those land silently and first surface on an unrelated PR.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/k8s-policy-webhook

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint deploy/helm

      - name: Render Helm chart with cert-manager
        run: |
          helm template k8s-policy-webhook deploy/helm \
            --namespace k8s-policy-webhook \
            --set certManager.enabled=true

      - name: Render Helm chart with external TLS
        run: |
          helm template k8s-policy-webhook deploy/helm \
            --namespace k8s-policy-webhook \
            --set certManager.enabled=false \
            --set tls.existingSecretName=k8s-policy-webhook-tls \
            --set webhook.caBundle=Y2EtYnVuZGxl

  repository-scan:
    name: Trivy Repository Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trivy filesystem report
        # aquasecurity/trivy-action v0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Enforce filesystem vulnerability gate
        id: trivy-fs-gate
        # aquasecurity/trivy-action v0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && steps.trivy-fs-gate.outcome != 'skipped' && hashFiles('trivy-fs.sarif') != '' }}
        with:
          sarif_file: trivy-fs.sarif

  image-check:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: k8s-policy-webhook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image report
        # aquasecurity/trivy-action v0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: k8s-policy-webhook:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      - name: Enforce image vulnerability gate
        id: trivy-image-gate
        # aquasecurity/trivy-action v0.35.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: k8s-policy-webhook:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && steps.trivy-image-gate.outcome != 'skipped' && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif

  e2e:
    name: Cluster E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: policy-e2e

      # Loaded up front so the cluster never pulls from Docker Hub mid-test,
      # which is the main source of flakiness on hosted runners. Goes via an
      # explicitly single-platform archive: "kind load docker-image" imports
      # --all-platforms and fails against Docker's containerd image store,
      # which keeps only one platform of a multi-arch manifest locally.
      - name: Preload test images
        run: |
          for image in nginxinc/nginx-unprivileged:1.25.3 busybox:1.36.1; do
            docker pull --platform linux/amd64 "$image"
            docker save --platform linux/amd64 "$image" -o /tmp/preload.tar
            kind load image-archive /tmp/preload.tar --name policy-e2e
          done
          # A silent load leaves the cluster pulling from Docker Hub mid-test,
          # which shows up as an unexplained readiness timeout. Fail loudly here.
          echo "images present in the cluster:"
          docker exec policy-e2e-control-plane crictl images
          for image in nginxinc/nginx-unprivileged busybox; do
            docker exec policy-e2e-control-plane crictl images | grep -q "$image" || {
              echo "::error::$image was not loaded into the cluster"; exit 1; }
          done

      # The cluster above is reused; the runner is discarded either way.
      - name: Run end-to-end suite
        env:
          KEEP_CLUSTER: "1"
        run: hack/e2e.sh policy-e2e

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::group::webhook"
          kubectl -n webhook-system get pods -o wide || true
          kubectl -n webhook-system logs -l app.kubernetes.io/name=k8s-policy-webhook --tail=100 || true
          echo "::endgroup::"
          echo "::group::test workload"
          kubectl -n policy-test get pods -o wide || true
          kubectl -n policy-test describe pod good-pod || true
          kubectl -n policy-test get events --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::cluster images"
          docker exec policy-e2e-control-plane crictl images || true
          echo "::endgroup::"

  publish-image:
    name: Publish Image
    needs:
      - verify
      - repository-scan
      - image-check
      - e2e
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
