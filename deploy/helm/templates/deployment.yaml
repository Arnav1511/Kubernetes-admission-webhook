apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-policy-webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-policy-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-policy-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-policy-webhook.selectorLabels" . | nindent 8 }}
        owner: platform-team
      annotations:
        checksum/policy: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "k8s-policy-webhook.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required; do not deploy an implicit latest tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          args:
            - --port={{ .Values.service.targetPort }}
            - --cert=/etc/webhook/certs/tls.crt
            - --key=/etc/webhook/certs/tls.key
            - --config=/etc/webhook/config/policy.yaml
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: config
              mountPath: /etc/webhook/config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "k8s-policy-webhook.tlsSecretName" . }}
        - name: config
          configMap:
            name: {{ include "k8s-policy-webhook.fullname" . }}-policy
