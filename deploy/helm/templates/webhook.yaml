{{- if and (not .Values.certManager.enabled) (not .Values.webhook.caBundle) -}}
{{- fail "webhook.caBundle is required when certManager.enabled=false. Provide the base64-encoded CA certificate bundle." -}}
{{- end -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "k8s-policy-webhook.fullname" . }}
  labels:
    {{- include "k8s-policy-webhook.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "k8s-policy-webhook.certificateName" . }}
  {{- end }}
webhooks:
  - name: validate.policy.k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "k8s-policy-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: {{ .Values.service.port }}
      {{- if not .Values.certManager.enabled }}
      caBundle: {{ required "webhook.caBundle is required when certManager.enabled=false" .Values.webhook.caBundle | quote }}
      {{- end }}
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        # pods/ephemeralcontainers is the subresource kubectl debug uses to
        # attach a container to a running pod. Without it, that path bypasses
        # every image and privilege policy enforced here.
        resources: ["pods", "pods/ephemeralcontainers"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
    # The webhook's own namespace is always excluded, on top of whatever
    # webhook.namespaceSelector configures. Without this the API server calls
    # the webhook to admit the webhook's own pods: with failurePolicy=Fail
    # nothing can start on a cold cluster, and a full outage is unrecoverable.
    namespaceSelector:
      {{- $selector := deepCopy .Values.webhook.namespaceSelector }}
      {{- $expressions := $selector.matchExpressions | default list }}
      {{- $ownNamespace := dict "key" "kubernetes.io/metadata.name" "operator" "NotIn" "values" (list .Release.Namespace) }}
      {{- $_ := set $selector "matchExpressions" (append $expressions $ownNamespace) }}
      {{- toYaml $selector | nindent 6 }}
